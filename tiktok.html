<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipFarm: TikTok sign-in</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#222}</style>
</head>
<body>
<h1>ClipFarm</h1>
<p id="msg">Returning to the ClipFarm app on your computer…</p>
<script>
  // The sign-in result is passed on to the ClipFarm app running locally on the user's computer.
  var q = location.search;
  if (q.indexOf("code=") !== -1 || q.indexOf("error=") !== -1) {
    location.replace("http://localhost:8000/oauth/tiktok/callback" + q);
  } else {
    document.getElementById("msg").textContent = "This page completes TikTok sign-in for the ClipFarm desktop app.";
  }
</script>
</body>
</html>
